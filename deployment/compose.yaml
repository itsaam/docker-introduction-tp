services:
  gateway:
    image: nginx:alpine
    configs:
      - source: gateway
        target: /etc/nginx/conf.d/default.conf
      - source: home
        target: /usr/share/nginx/html/index.html
      - source: styles
        target: /usr/share/nginx/html/style.css
      - source: navigation
        target: /usr/share/nginx/html/navigation.js

  react:
    build:
      context: ../dockerfile-exercice1
      args:
        PUBLIC_URL: /react

  quiz:
    build:
      context: ../dockerfile-exercice2
      args:
        VITE_BASE: /quiz/

  flask:
    build: ../dockerfile-exercice3

  drupal:
    image: drupal:10-apache
    depends_on:
      postgres:
        condition: service_healthy
    configs:
      - source: drupal_path
        target: /etc/apache2/conf-enabled/docker-lab.conf
    volumes:
      - drupal_modules:/var/www/html/modules
      - drupal_profiles:/var/www/html/profiles
      - drupal_sites:/var/www/html/sites
      - drupal_themes:/var/www/html/themes

  postgres:
    extends:
      file: ../docker-compose-exercice1/docker-compose.yml
      service: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}

configs:
  gateway:
    file: ./gateway.conf
  home:
    file: ./index.html
  styles:
    file: ./style.css
  navigation:
    file: ./navigation.js
  drupal_path:
    file: ./drupal.conf

volumes:
  drupal_modules:
  drupal_profiles:
  drupal_sites:
  drupal_themes:
  postgres_data:
