resolver 127.0.0.11 valid=10s ipv6=off;

map $http_cf_visitor $tunnel_scheme {
    default $scheme;
    ~https https;
}

map $http_x_forwarded_proto $origin_scheme {
    https https;
    default $tunnel_scheme;
}

upstream lab_react {
    zone lab_react 64k;
    server react:3000 resolve;
}

upstream lab_quiz {
    zone lab_quiz 64k;
    server quiz:80 resolve;
}

upstream lab_flask {
    zone lab_flask 64k;
    server flask:5000 resolve;
}

upstream lab_drupal {
    zone lab_drupal 64k;
    server drupal:80 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $origin_scheme;

    location = / { try_files /index.html =404; }
    location = /style.css { try_files $uri =404; }
    location = /navigation.js { try_files $uri =404; }

    location = /react { return 308 /react/; }
    location /react/ { proxy_pass http://lab_react/; }

    location = /quiz { return 308 /quiz/; }
    location /quiz/ { proxy_pass http://lab_quiz/; }

    location = /flask { return 308 /flask/; }
    location /flask/ { proxy_pass http://lab_flask/; }

    location = /drupal { return 308 /drupal/; }
    location /drupal/ {
        client_max_body_size 8m;
        proxy_redirect http://$http_host/ /;
        proxy_pass http://lab_drupal;
    }

    location / { return 404; }
}
